name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # mesa-vulkan-drivers: los snapshots de egui_kittest corren wgpu sin GPU.
      - name: Instalar dependencias de tests y empaquetado
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev libvulkan1 mesa-vulkan-drivers

      - name: Verificar que el tag coincida con Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "notetake") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "El tag $GITHUB_REF_NAME no coincide con Cargo.toml (v$version)" >&2
            exit 1
          fi

      - run: cargo test --locked

      - run: cargo install cargo-deb --locked

      - run: cargo deb

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Reintento de un job fallido: solo reemplaza el artefacto.
            gh release upload "$GITHUB_REF_NAME" target/debian/*.deb --clobber
          else
            gh release create "$GITHUB_REF_NAME" target/debian/*.deb --generate-notes
          fi
