[package]
name = "notetake"
version = "0.5.1"
edition = "2024"
rust-version = "1.95"
authors = ["Kevin Rua"]
license = "MIT"
repository = "https://github.com/Kevinrua2003/notetake"
description = "App de notas de escritorio, personal y minimalista"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "wayland",
    "x11",
    "accesskit",
    "clipboard",
    "default_fonts",
    "persistence",
] }
arboard = "3"
serde = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
ureq = "3.5.0"
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3"
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }

[profile.release]
opt-level = 2

[package.metadata.deb]
section = "utils"
priority = "optional"
license-file = "LICENSE"
# $auto solo detecta enlaces reales; glutin/winit cargan GL/EGL/wayland por
# dlopen, así que van explícitos.
depends = "$auto, libgl1, libxkbcommon0, libwayland-client0"
assets = [
    # target/release es la ruta que cargo-deb espera y reemplaza por la real.
    ["target/release/notetake", "usr/bin/", "755"],

    # El archivo .desktop va a la ruta global de aplicaciones
    ["assets/notetake.desktop", "usr/share/applications/", "644"],

    # El nombre debe ser igual al de Icon= y el dir el tamaño real (512 px)
    ["assets/icon.png", "usr/share/icons/hicolor/512x512/apps/notetake.png", "644"],

    # Con assets explícitos se pierde el $auto de documentación
    ["README.md", "usr/share/doc/notetake/README.md", "644"],
    ["LICENSE", "usr/share/doc/notetake/LICENSE", "644"],
    ["assets/Inter-OFL.txt", "usr/share/doc/notetake/Inter-OFL.txt", "644"],
]
