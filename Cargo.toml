[package]
name = "notetake"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "wayland",
    "x11",
    "accesskit",
    "default_fonts",
    "persistence",
] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 2
